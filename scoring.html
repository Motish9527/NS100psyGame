<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ed">
  <meta name="description" content="職場動物測驗的計分方式：每個選項對應的特質與加權分數。">
  <title>計分方式｜牛馬再就業協會</title>
  <style>
    :root {
      color-scheme: light;
      --brand-dark: #5b382b;
      --brand-coral: #b74325;
      --cream: #fff8ed;
      --paper: #fffefb;
      --ink: #342d29;
      --muted: #766d67;
      --line: #eadfd3;
      --shadow: 0 24px 70px rgba(91, 56, 43, .12);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--cream);
    }

    a:focus-visible { outline: 3px solid var(--brand-coral); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .shell {
      width: min(760px, calc(100% - 30px));
      margin: 0 auto;
      padding: 32px 0 44px;
    }

    .brand {
      margin: 0 0 22px;
      color: var(--brand-dark);
      font-size: .88rem;
      font-weight: 800;
      letter-spacing: .06em;
    }

    h1, h2 {
      margin: 0;
      color: var(--brand-dark);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    }

    h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.3; }

    .panel {
      margin-top: 18px;
      padding: clamp(19px, 4vw, 30px);
      border: 1px solid rgba(91, 56, 43, .08);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .panel h2 { font-size: 1.15rem; line-height: 1.5; }

    .rules {
      margin: 12px 0 0;
      padding-left: 1.3em;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.85;
    }

    .totals, .weights {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .chip {
      padding: 4px 11px;
      border: 1px solid #f5e1bd;
      border-radius: 999px;
      color: #4c483d;
      background: #fff0cf;
      font-size: .82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .question-number {
      margin: 0 0 5px;
      color: var(--brand-coral);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .option-list {
      display: grid;
      gap: 10px;
      margin: 15px 0 0;
      padding: 0;
      list-style: none;
    }

    .option {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .option.is-selected {
      border-color: var(--brand-coral);
      background: #fff0e7;
      box-shadow: inset 0 0 0 1px var(--brand-coral);
    }

    .option-text { margin: 0; font-size: .92rem; line-height: 1.65; }
    .option-letter { margin-right: 6px; color: var(--brand-coral); font-weight: 900; }
    .option .weights { margin-top: 9px; }

    .selected-badge {
      display: inline-block;
      margin-left: 7px;
      padding: 1px 9px;
      border-radius: 999px;
      color: #fffefb;
      background: var(--brand-coral);
      font-size: .72rem;
      font-weight: 800;
      vertical-align: 1px;
      white-space: nowrap;
    }

    .home-link {
      display: block;
      width: fit-content;
      margin: 26px auto 0;
      color: var(--brand-coral);
      font-size: .92rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="brand">牛馬再就業協會</p>
    <h1>計分方式</h1>

    <section class="panel" aria-labelledby="rules-title">
      <h2 id="rules-title">怎麼算出結果？</h2>
      <ol class="rules">
        <li>每個選項都是 3 分，依下方加權分給一到三種動物。</li>
        <li>全部作答後，總分最高的動物就是你的結果。</li>
        <li>同分時，比較誰拿到較多次「2 分以上」的加權。</li>
        <li>仍然同分時，依衝鋒牛、領山虎、遠見鷹、靈活豹、群戰狼、暖心犬的順序決定。</li>
      </ol>
    </section>

    <section class="panel" id="totals-panel" aria-labelledby="totals-title" hidden>
      <h2 id="totals-title">你的總分</h2>
      <ul class="totals" id="totals"></ul>
    </section>

    <div id="question-list"></div>

    <a class="home-link" href="index.html">回測驗首頁</a>
  </main>

  <script src="quiz-data.js"></script>
  <script>
    const answerParam = new URLSearchParams(location.search).get("answers") || "";
    const answers = new RegExp(`^[0-3]{${questions.length}}$`).test(answerParam)
      ? [...answerParam].map(Number)
      : null;

    function createChip(text) {
      const chip = document.createElement("li");
      chip.className = "chip";
      chip.textContent = text;
      return chip;
    }

    function createOption([text, weights], optionIndex, isSelected) {
      const option = document.createElement("li");
      option.className = "option";
      option.classList.toggle("is-selected", isSelected);

      const paragraph = document.createElement("p");
      paragraph.className = "option-text";
      const letter = document.createElement("span");
      letter.className = "option-letter";
      letter.textContent = String.fromCharCode(65 + optionIndex);
      paragraph.append(letter, text);
      if (isSelected) {
        const badge = document.createElement("span");
        badge.className = "selected-badge";
        badge.textContent = "你的選擇";
        paragraph.append(badge);
      }

      const weightList = document.createElement("ul");
      weightList.className = "weights";
      Object.entries(weights).forEach(([animalId, points]) => {
        const animal = animals[animalId];
        weightList.append(createChip(`${animal.emoji} ${animal.name} +${points}`));
      });

      option.append(paragraph, weightList);
      return option;
    }

    const questionList = document.querySelector("#question-list");
    questions.forEach((question, questionIndex) => {
      const panel = document.createElement("section");
      panel.className = "panel";

      const number = document.createElement("p");
      number.className = "question-number";
      number.textContent = `情境 ${String(questionIndex + 1).padStart(2, "0")}`;

      const title = document.createElement("h2");
      title.textContent = question.title;

      const optionList = document.createElement("ol");
      optionList.className = "option-list";
      question.options.forEach((option, optionIndex) => {
        optionList.append(createOption(option, optionIndex, answers?.[questionIndex] === optionIndex));
      });

      panel.append(number, title, optionList);
      questionList.append(panel);
    });

    if (answers) {
      const scores = Object.fromEntries(Object.keys(animals).map((animalId) => [animalId, 0]));
      answers.forEach((answer, questionIndex) => {
        Object.entries(questions[questionIndex].options[answer][1]).forEach(([animalId, points]) => {
          scores[animalId] += points;
        });
      });
      const totals = document.querySelector("#totals");
      Object.entries(scores)
        .sort((left, right) => right[1] - left[1])
        .forEach(([animalId, score]) => {
          totals.append(createChip(`${animals[animalId].emoji} ${animals[animalId].name} ${score} 分`));
        });
      document.querySelector("#totals-panel").hidden = false;
    }
  </script>
</body>
</html>
